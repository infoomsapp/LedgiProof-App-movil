name: ledgiproof
description: "LedgiProof mobile - Olympus Mont Systems LLC"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

# ============================================================
# DEPENDENCIES
# ============================================================

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- Supabase (same project as the web app: hceihybnqjpzqyibkznp) ---
  supabase_flutter: ^2.5.6

  # --- State management (matches controlmiles' convention) ---
  provider: ^6.1.1

  # --- Local, per-device only (remembered tab, draft state) ---
  shared_preferences: ^2.5.4

  # --- GPS for the basic in-app trip tracker (foreground only -- unlike
  # controlmiles' geolocator + flutter_background_service pairing, no
  # background service here on purpose, see trip_tracker_screen.dart) ---
  geolocator: ^13.0.2

  # --- Camera capture for receipt scanning ---
  image_picker: ^1.1.0
  # UUID for storage paths, matching upload.service.ts's crypto.randomUUID()
  uuid: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # The web app's own logo files, copied verbatim from
    # LedgiProof/src/assets so the two products show the same mark.
    # The Android launcher icon is deliberately NOT one of these: it is
    # a separate piece of artwork (design/app_icon_source.png).
    - assets/brand/logo_full.png
    - assets/brand/logo_mark.png
    # Same lockup lifted off its white plate, one variant per palette:
    # the wordmark ink is black, so on the dark theme it is inverted to
    # white while the blue of "Proof" and of the check is left alone.
    - assets/brand/logo_full_onlight.png
    - assets/brand/logo_full_ondark.png
